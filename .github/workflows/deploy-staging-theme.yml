name: Deploy WordPress theme to staging

on:
  push:
    branches: [main]
    paths:
      - 'wordpress-theme/tracing-the-path/**'
      - '.github/workflows/deploy-staging-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy theme
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure verified SFTP connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TTP_STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.TTP_STAGING_SFTP_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload theme files
        env:
          SFTP_HOST: ${{ secrets.TTP_STAGING_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.TTP_STAGING_SFTP_PORT }}
          SFTP_USER: ${{ secrets.TTP_STAGING_SFTP_USER }}
        run: |
          sftp -b - -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -P "$SFTP_PORT" "$SFTP_USER@$SFTP_HOST" <<'EOF'
          put -r wordpress-theme/tracing-the-path/* .
          EOF
